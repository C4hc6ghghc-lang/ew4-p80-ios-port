name: Build EW4 P80 unsigned IPA
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ew4-p80-ipa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          chmod +x BUILD_FROM_CODEX_MAC.sh
          chmod +x SOURCE_NATIVE/EW4_iOS_NativePort/BUILD_FROM_CODEX_MAC.sh
          chmod +x SOURCE_NATIVE/EW4_iOS_NativePort/Tools/build_unsigned_ipa.sh
      - name: Install reference rendering test dependency
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/ew4-test-deps" --no-audit --no-fund skia-canvas@3.0.8
          echo "NODE_PATH=$RUNNER_TEMP/ew4-test-deps/node_modules" >> "$GITHUB_ENV"
      - name: Run preserved checks and build IPA
        shell: bash
        run: |
          set -euo pipefail
          bash BUILD_FROM_CODEX_MAC.sh 2>&1 | tee cloud-build.log
      - name: Save IPA and diagnostics to private draft release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, zipfile
          candidates = [pathlib.Path(x) for x in ('cloud-build.log', 'P80_CODEX_JS_REGRESSION.log', 'P80_MAP_UNIT_DYNAMIC_STATE_AUDIT.log')]
          candidates += list(pathlib.Path('SOURCE_NATIVE/EW4_iOS_NativePort/build/reports').rglob('*'))
          with zipfile.ZipFile('build-diagnostics.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in candidates:
                  if path.is_file(): archive.write(path, path.as_posix())
          PY
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "P80 build ${GITHUB_RUN_NUMBER}" --notes "Private build output and diagnostics. Check the Actions run for build status. Any IPA is unsigned and requires device testing."
          gh release upload "$tag" build-diagnostics.zip
          ipa=SOURCE_NATIVE/EW4_iOS_NativePort/build/EW4NativePort-unsigned.ipa
          if [ -f "$ipa" ] && [ -f "$ipa.sha256" ]; then
            gh release upload "$tag" "$ipa" "$ipa.sha256"
          fi
