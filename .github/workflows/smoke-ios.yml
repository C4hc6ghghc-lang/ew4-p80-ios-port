name: Smoke test P80 iPhone and iPad
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and launch simulator app
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          mkdir -p smoke-results
          bash SOURCE_NATIVE/EW4_iOS_NativePort/Tools/smoke_simulators.sh 2>&1 | tee smoke-results/smoke.log
      - name: Save simulator evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip -qr simulator-evidence.zip smoke-results
          tag="smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in 1 2 3; do
            if gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --target "$GITHUB_SHA" --title "P80 simulator smoke ${GITHUB_RUN_NUMBER}" --notes "iPhone and iPad simulator launch evidence. Physical-device gameplay testing is still required."; then
              break
            fi
            sleep 5
          done
          gh release view "$tag" >/dev/null
          uploaded=false
          for attempt in 1 2 3; do
            if gh release upload "$tag" simulator-evidence.zip --clobber; then
              uploaded=true
              break
            fi
            sleep 5
          done
          test "$uploaded" = true
