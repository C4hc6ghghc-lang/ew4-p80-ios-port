name: EW4NativePort
options:
  bundleIdPrefix: local.ew4
  deploymentTarget:
    iOS: "15.0"
packages:
  EW4NativeCore:
    path: ../NativeCore
targets:
  EW4NativePort:
    type: application
    platform: iOS
    sources:
      - path: App
      # CRITICAL: keep the whole Resources directory as a folder reference.
      # There are hundreds of duplicate basenames in different subdirectories;
      # flattening resources would silently overwrite runtime assets.
      - path: ../Resources
        type: folder
        # A top-level Resources folder makes CFBundle misidentify an iOS app.
        # Preserve the hierarchy beneath a non-reserved parent instead.
        buildPhase:
          copyFiles:
            destination: resources
            subpath: GameAssets
    dependencies:
      - package: EW4NativeCore
        product: EW4NativeCore
      - package: EW4NativeCore
        product: EW4NativeRenderer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.ew4.nativeport
        PRODUCT_NAME: EW4NativePort
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "81"
        SWIFT_VERSION: 6.0
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  EW4NativePortUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: EW4NativePort
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.ew4.nativeport.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: EW4NativePort
schemes:
  EW4NativePort:
    build:
      targets:
        EW4NativePort: all
    test:
      targets:
        - EW4NativePortUITests
